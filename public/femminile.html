<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Volley Ladispoli · 2ª Divisione Femminile</title>
  <meta name="description" content="Calendario partite, risultati live e classifica A.S.D. Volley Ladispoli - Seconda Divisione Femminile Girone A (FIPAV 64591)." />
  <meta property="og:title" content="Volley Ladispoli · 2ª Divisione Femminile" />
  <meta property="og:description" content="Calendario interattivo, orari, palestre con Google Maps, export calendario e classifica ufficiale FIPAV Girone A (2026/2027)." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://volley-ladispoli-paste.onrender.com/icon-512.png" />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="manifest" href="/manifest-femminile.json" />
  <link rel="icon" type="image/jpeg" href="/logo-ladispoli.jpg" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VL 2ª Div F" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- TOP NAVIGATION BAR (MINIMAL 56PX) -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <img src="/logo-ladispoli.jpg" alt="Logo Volley Ladispoli" class="brand-logo" onerror="this.style.display='none'" />
        <div class="brand-titles">
          <span class="brand-name">Volley Ladispoli</span>
          <span class="brand-sub">2ª Div. Femminile · Girone A</span>
        </div>
      </div>

      <div class="topbar-right">
        <button id="btnSharePage" class="icon-pill-btn" type="button" aria-label="Condividi link calendario">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" x2="12" y1="2" y2="15"/>
          </svg>
          <span>Condividi</span>
        </button>

        <button id="btnRefreshTop" class="icon-pill-btn" type="button" aria-label="Aggiorna dati FIPAV">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
          <span>Aggiorna</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN SCROLL CONTAINER -->
  <div id="topScrollSentinel" class="scroll-sentinel" aria-hidden="true"></div>
  <main class="app-shell">

    <!-- ==========================================
         VIEW 1: PARTITE (CALENDARIO FIPAV 64591)
         ========================================== -->
    <section id="view-calendario" class="view-panel active" role="tabpanel">
      <!-- LAST MATCH RESULT BANNER -->
      <div id="lastMatchCard" class="last-match-card hidden"></div>

      <!-- NEXT MATCH FEATURE CARD -->
      <div id="nextMatchCard" class="next-match-card"></div>

      <!-- INTERACTIVE SPATIAL-TEMPORAL MONTHLY CALENDAR -->
      <div class="ios-section">
        <div class="ios-section-header">
          <h2 class="ios-section-title">Calendario Interattivo Stagione</h2>
          <div style="display:flex; align-items:center; gap:0.65rem;">
            <span id="calMonthMatchCount" class="text-subtle-meta"></span>
            <button id="btnRefreshFipavCal" class="text-action-btn" type="button">Aggiorna</button>
          </div>
        </div>

        <div class="spatial-calendar-card">
          <!-- MONTH SCROLLER PILLS -->
          <div id="calMonthPills" class="month-pills-bar"></div>

          <!-- MONTH HEADER WITH PREV/NEXT -->
          <div class="cal-nav-header">
            <button type="button" id="btnCalPrevMonth" class="cal-arrow-btn" aria-label="Mese precedente">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="cal-month-title-wrap">
              <h3 id="calCurrentMonthLabel" class="cal-month-title">Novembre 2026</h3>
              <span class="cal-legend-inline">
                <span class="legend-dot legend-home"></span>Casa
                <span class="legend-dot legend-away"></span>Trasferta
              </span>
            </div>
            <button type="button" id="btnCalNextMonth" class="cal-arrow-btn" aria-label="Mese successivo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>

          <!-- WEEKDAY HEADERS -->
          <div class="cal-weekdays-grid">
            <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
          </div>

          <!-- 7-COL SPATIAL DAYS GRID -->
          <div id="calDaysGrid" class="cal-days-grid"></div>

          <!-- SELECTED DAY SPOTLIGHT -->
          <div id="calSelectedMatchSpotlight" class="cal-spotlight"></div>
        </div>
      </div>

      <!-- UPCOMING MATCHES LIST WITH LOGOS -->
      <div class="ios-section">
        <div class="ios-section-header">
          <h2 class="ios-section-title">Tutte le 22 Partite</h2>
          <button id="btnDownloadAllIcs" class="text-action-btn" type="button">Salva tutte (.ics)</button>
        </div>

        <div class="filter-bar">
          <div class="segmented-control segmented-scroll" id="matchFilterControl">
            <button type="button" class="seg-btn active" data-matchfilter="upcoming">Prossime</button>
            <button type="button" class="seg-btn" data-matchfilter="played">Risultati</button>
            <button type="button" class="seg-btn" data-matchfilter="home">Casa</button>
            <button type="button" class="seg-btn" data-matchfilter="away">Trasferta</button>
            <button type="button" class="seg-btn" data-matchfilter="all">Tutte</button>
          </div>
        </div>

        <div id="matchesList" class="matchup-cards-stack"></div>
      </div>
    </section>

    <!-- ==========================================
         VIEW 2: CLASSIFICA GIRONE A
         ========================================== -->
    <section id="view-classifica" class="view-panel" role="tabpanel">
      <div class="ios-section">
        <div class="ios-section-header">
          <h2 class="ios-section-title">Classifica Girone A</h2>
          <div style="display:flex; gap:0.75rem; align-items:center;">
            <button id="btnRefreshFipav" class="text-action-btn" type="button">Aggiorna</button>
            <a href="https://public.fipavonline.it/gironi/64591" target="_blank" rel="noopener noreferrer" class="text-action-btn">FIPAV ↗</a>
          </div>
        </div>

        <div class="ios-list-group standings-wrap">
          <table class="clean-table">
            <thead>
              <tr>
                <th class="col-rank">#</th>
                <th>Squadra</th>
                <th class="col-num">PT</th>
                <th class="col-num">G</th>
                <th class="col-num">V</th>
                <th class="col-num">P</th>
                <th class="col-num hide-xs">SV/SP</th>
              </tr>
            </thead>
            <tbody id="standingsBody"></tbody>
          </table>
        </div>
        <p id="fipavSyncMeta" class="footnote-text"></p>
      </div>

      <!-- OTHER MATCHES BY GIORNATA -->
      <div class="ios-section">
        <div class="ios-section-header">
          <h2 class="ios-section-title">Risultati del Girone</h2>
          <select id="giornataSelect" class="inline-select" aria-label="Seleziona giornata"></select>
        </div>
        <div id="gironeMatchesList" class="ios-list-group"></div>
      </div>
    </section>

  </main>

  <!-- ==========================================
       BOTTOM TAB BAR (2 TABS)
       ========================================== -->
  <nav class="bottom-bar" aria-label="Navigazione principale">
    <div class="bottom-bar-inner bottom-bar-two-tabs">
      <button type="button" class="nav-tab active" data-view="calendario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
        <span>Partite</span>
      </button>

      <button type="button" class="nav-tab" data-view="classifica">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
        <span>Classifica</span>
      </button>
    </div>
  </nav>

  <!-- ==========================================
       MATCH DETAIL BOTTOM SHEET
       ========================================== -->
  <div id="sheetMatch" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="sheetMatchTitle">
    <div class="bottom-sheet" data-sheet="sheetMatch">
      <div class="sheet-grabber-area"><div class="sheet-grabber"></div></div>
      <div class="sheet-header">
        <div>
          <span id="sheetMatchGiornata" class="sheet-eyebrow">GIORNATA</span>
          <h3 id="sheetMatchTitle" class="sheet-title">Dettaglio Partita</h3>
        </div>
        <button type="button" class="sheet-close-btn" data-close="sheetMatch" aria-label="Chiudi">✕</button>
      </div>
      <div id="sheetMatchBody" class="sheet-body"></div>
    </div>
  </div>

  <!-- TOAST STACK -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="/fipav-fallback-64591.js"></script>
  <script src="/femminile.js"></script>
</body>
</html>
